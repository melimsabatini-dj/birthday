<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>LOTERIA DO AZAR - SABATINI28</title>


    <style>

        /* =========================================
           FONTES
        ========================================= */

        @font-face {

            font-family: "POI Diode";

            src:
                url("fonts/POIDiodeTrial-Bold.woff2")
                format("woff2");

            font-weight: 700;
            font-style: normal;

            font-display: swap;

        }


        @font-face {

            font-family: "Moderat";

            src:
                url("fonts/Moderat-Mono-Light.woff2")
                format("woff2");

            font-weight: 300;
            font-style: normal;

            font-display: swap;

        }



        /* =========================================
           RESET
        ========================================= */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        html,
        body {

            width: 100%;

            min-height: 100%;

            background: #000;

        }


        body {

            overflow-x: hidden;

            background: #000;

        }



        /* =========================================
           PÁGINA
        ========================================= */

        .loteria-page {

            position: relative;

            width: 100%;

            min-height: 100vh;

            background: #000;

            padding:
                16px
                16px
                35px;

        }


        @media (min-width: 700px) {

            .loteria-page {

                padding:
                    20px
                    30px
                    50px;

            }

        }


        @media (max-width: 380px) {

            .loteria-page {

                padding-left: 11px;

                padding-right: 11px;

            }

        }



        /* =========================================
           VOLTAR
        ========================================= */

        .back {

            position: absolute;

            top: 12px;

            left: 14px;

            border: 0;

            background: none;

            color: #FF5C00;

            font-family:
                "POI Diode",
                sans-serif;

            font-size: 42px;

            line-height: 1;

            cursor: pointer;

            z-index: 20;

            transition:
                transform 100ms ease,
                color 80ms linear;

        }


        .back:active {

            transform:
                translateX(-8px)
                scale(1.15);

        }



        /* =========================================
           TÍTULO
        ========================================= */

        .title {

            width: 100%;

            margin-top: 52px;

            color: #00FF38;

            font-family:
                "POI Diode",
                sans-serif;

            font-size:
                clamp(
                    70px,
                    19vw,
                    200px
                );

            line-height: 0.72;

            letter-spacing: -0.04em;

            text-align: center;

            user-select: none;

            margin-bottom: 40px;

        }


        @media (max-width: 380px) {

            .title {

                font-size: 62px;

            }

        }



        /* =========================================
           BOTÃO JOGAR
        ========================================= */

        .play {

            display: block;

            margin:
                30px auto
                34px;

            padding:
                12px
                24px;

            border:
                4px solid #FF5C00;

            background: #000;

            color: #FF5C00;

            font-family:
                "POI Diode",
                sans-serif;

            font-size:
                clamp(
                    25px,
                    6vw,
                    42px
                );

            line-height: 0.9;

            cursor: pointer;

            transition:
                background-color 70ms linear,
                color 70ms linear,
                transform 100ms ease,
                opacity 200ms ease;

            text-transform: uppercase;

            letter-spacing: -0.04em;

        }


        .play:active {

            background: #FF5C00;

            color: #000;

            transform:
                scaleX(1.10)
                scaleY(0.90);

        }


        .play.hidden {

            opacity: 0;

            pointer-events: none;

        }


        @media (min-width: 700px) {

            .play {

                margin-top: 36px;

                margin-bottom: 38px;

            }

        }


        @media (max-width: 380px) {

            .play {

                margin-top: 24px;

                margin-bottom: 26px;

                border-width: 3px;

            }

        }



        /* =========================================
           CONTAINER RESULTADO
        ========================================= */

        .result-container {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 150px;

        }



        /* =========================================
           CAIXA DE RESULTADO
        ========================================= */

        .result-box {

            width: 100%;

            min-height: 78px;

            padding:
                13px
                12px;

            border:
                4px solid #FF5C00;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background: #000;

            color: #00FF38;

            font-family:
                "Moderat",
                monospace;

            font-weight: 300;

            font-size:
                clamp(
                    21px,
                    6vw,
                    48px
                );

            line-height: 1.4;

            letter-spacing: -0.04em;

            text-align: center;

            text-transform: uppercase;

            user-select: none;

            opacity: 0;

            transition:
                transform 100ms
                cubic-bezier(.2,.8,.2,1),

                color 70ms linear;

        }


        .result-box.visible {

            opacity: 1;

        }


        .result-box.spinning {

            animation:
                box-shake
                80ms
                infinite;

        }


        @keyframes box-shake {

            0% {

                transform:
                    translateX(-2px)
                    scaleX(1.01);

            }

            50% {

                transform:
                    translateX(2px)
                    scaleX(0.99);

            }

            100% {

                transform:
                    translateX(-2px)
                    scaleX(1.01);

            }

        }


        .result-box.finished {

            animation:
                finish-box
                180ms
                ease;

        }


        @keyframes finish-box {

            0% {

                transform:
                    scaleX(1)
                    scaleY(1);

            }

            35% {

                transform:
                    scaleX(1.06)
                    scaleY(0.91);

            }

            65% {

                transform:
                    scaleX(0.98)
                    scaleY(1.05);

            }

            100% {

                transform:
                    scaleX(1)
                    scaleY(1);

            }

        }


        @media (min-width: 700px) {

            .result-box {

                min-height: 90px;

                font-size:
                    clamp(
                        30px,
                        4vw,
                        58px
                    );

            }

        }


        @media (max-width: 380px) {

            .result-box {

                min-height: 67px;

                border-width: 3px;

                font-size: 19px;

            }

        }

    </style>

</head>


<body>


    <main class="loteria-page">


        <!-- =====================================
             VOLTAR
        ====================================== -->

        <button
            class="back"
            onclick="history.back()"
            aria-label="Voltar"
        >
            ←
        </button>



        <!-- =====================================
             TÍTULO
        ====================================== -->

        <h1 class="title">
            LOTERIA DO AZAR
        </h1>



        <!-- =====================================
             BOTÃO JOGAR
        ====================================== -->

        <button
            class="play"
            id="play"
        >
            JOGAR
        </button>



        <!-- =====================================
             RESULTADO
        ====================================== -->

        <section class="result-container">

            <div
                class="result-box"
                id="result"
            ></div>

        </section>


    </main>



    <script>


        /* =========================================
           OPÇÕES DA LOTERIA
        ========================================= */

        const loteriaOpcoes = [

            "BILLIE EILISH: VOCÊ DEVE UM XOTÃO PRO ANIVERSARIANTE",
            "CHAPPELL ROAN: VOCÊ DEVE UM XOTÃO PRO ANIVERSARIANTE",
            "ALOK: VOCÊ TEM DIREITO A ESCOLHER UMA MÚSICA",
            "PEDRO SAMPAIO: VOCÊ TEM DIREITO A ESCOLHER UMA MÚSICA",
            "KATSEYE: VOCÊ TEM QUE APRENDER UMA COREOGRAFIA PRA APRESENTAR",
            "CHAPPELL ROAN: VOCÊ GANHOU UM XOTÃO",
            "ANITTA: VOCÊ GANHOU UM BEIJO DO ANIVERSARIANTE",
            "RITA ORA: VOCÊ NÃO LEVA NADA",
            "KATY PERRY: PERDEU",
            "AVA MAX: SE FERROU",
            "RITA ORA: DEU AZAR",
            "KATY PERRY: FLOPOU",
            "AVA MAX: NEM TENTA",
            "UH É LOTUS TOUR",
            "CAN I GET A WITNESS?",
            "AVA MAX: FLOPOU",
            "RITA ORA: COITADA",
            "CHAPPELL ROAN: O SABATINI GANHA XOTÃO",
            "ARIANA GRANDE: PODE ROUBAR O MARIDO DE ALGUÉM",
            "FLOPOU AMORE",
            "KKKKKKK",
            "TU JURA",
            "DIA 30 DE FEVEREIRO TE CONTO",
            "JUROU",
            "AI TADINHA MAS PARABÉNS POR TENTAR",
            "MICO",
            "VÊ SE NA UNDR TU GANHA ALGO"

        ];



        /* =========================================
           ELEMENTOS
        ========================================= */

        const playBtn =
            document.getElementById(
                "play"
            );

        const resultBox =
            document.getElementById(
                "result"
            );



        /* =========================================
           PALETA
        ========================================= */

        const colors = [

            "#087AFF",
            "#B000FF",
            "#FF5C00",
            "#00FF38",
            "#E5FF00"

        ];



        /* =========================================
           ITEM ALEATÓRIO
        ========================================= */

        function randomItem(array) {

            return array[
                Math.floor(
                    Math.random()
                    *
                    array.length
                )
            ];

        }



        /* =========================================
           COR ALEATÓRIA
        ========================================= */

        function randomColor() {

            return colors[
                Math.floor(
                    Math.random()
                    *
                    colors.length
                )
            ];

        }



        /* =========================================
           JOGAR
        ========================================= */

        function playLoteria() {

            /*
                Torna visível
            */

            resultBox.classList.add(
                "visible"
            );


            /*
                Começa animação
            */

            resultBox.classList.add(
                "spinning"
            );


            let counter = 0;

            const totalSpins =
                15 +
                Math.floor(
                    Math.random() * 10
                );

            const speed = 65;

            const spinner =
                setInterval(function() {

                    resultBox.textContent =
                        randomItem(
                            loteriaOpcoes
                        );

                    resultBox.style.color =
                        randomColor();

                    counter++;

                    if (
                        counter >=
                        totalSpins
                    ) {

                        clearInterval(
                            spinner
                        );

                        resultBox.textContent =
                            randomItem(
                                loteriaOpcoes
                            );

                        resultBox.style.color =
                            randomColor();

                        resultBox.classList.remove(
                            "spinning"
                        );

                        resultBox.classList.add(
                            "finished"
                        );

                        setTimeout(function() {

                            resultBox.classList.remove(
                                "finished"
                            );

                        }, 180);

                        /*
                            Esconde botão
                        */

                        playBtn.classList.add(
                            "hidden"
                        );

                    }

                }, speed);

        }



        /* =========================================
           EVENT LISTENER
        ========================================= */

        playBtn.addEventListener(
            "click",
            playLoteria
        );



        /* =========================================
           INTERAÇÃO DESKTOP
        ========================================= */

        resultBox.addEventListener(
            "mousemove",
            function(event) {

                if (
                    resultBox.classList.contains(
                        "spinning"
                    )
                ) {
                    return;
                }

                const rect =
                    resultBox.getBoundingClientRect();

                const x =
                    event.clientX -
                    rect.left;

                const percentage =
                    x /
                    rect.width;

                const rotation =
                    (
                        percentage -
                        0.5
                    )
                    * 5;

                resultBox.style.transform = `

                    skewX(
                        ${rotation}deg
                    )

                    scaleX(1.015)

                `;

            }
        );


        resultBox.addEventListener(
            "mouseleave",
            function() {

                if (
                    !resultBox.classList.contains(
                        "spinning"
                    )
                ) {

                    resultBox.style.transform =
                        "";

                }

            }
        );



        /* =========================================
           INTERAÇÃO MOBILE
        ========================================= */

        resultBox.addEventListener(
            "touchstart",
            function() {

                resultBox.style.transform =
                    "scaleX(1.025) scaleY(.96)";

            },
            {
                passive: true
            }
        );


        resultBox.addEventListener(
            "touchend",
            function() {

                setTimeout(function() {

                    resultBox.style.transform =
                        "";

                }, 100);

            }
        );


    </script>

</body>

</html>
