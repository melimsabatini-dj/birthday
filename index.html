<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>SABATINI28</title>


    <style>

        /* =========================================
           FONTE
        ========================================= */

        @font-face {
            font-family: "POI Diode";
            src: url("fonts/POIDiodeTrial-Bold.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }


        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            overflow: hidden;
            background: #000;
        }


        /* =========================================
           CONTAINER
        ========================================= */

        .screen {
            position: relative;
            width: 100vw;
            height: 100dvh;
            min-height: 100vh;
            overflow: hidden;
            background: #000;
        }


        /* =========================================
           TELAS
        ========================================= */

        .scene {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 100ms linear;
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
        }


        /* =========================================
           INTRO — GRADE DE SABATINI28
        ========================================= */

        #intro {
            display: block;
            overflow: hidden;
        }

        .intro-grid {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            overflow: hidden;
        }

        .intro-line {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            font-family: "POI Diode", sans-serif;
            font-weight: 700;
            font-size: clamp(42px, 12vw, 170px);
            line-height: .72;
            letter-spacing: -.045em;
            white-space: nowrap;
            text-align: center;
            user-select: none;
            will-change: transform, color;
            color: #00FF38;
        }


        /* =========================================
           DATA
        ========================================= */

        #dateText {
            width: 100%;
            padding: 0 4vw;
            font-family: "POI Diode", sans-serif;
            font-weight: 700;
            font-size: clamp(48px, 14vw, 190px);
            line-height: .8;
            letter-spacing: -.045em;
            color: #FF5C00;
            text-align: center;
            white-space: nowrap;
            will-change: transform, color;
        }


        /* =========================================
           LOCAL
        ========================================= */

        #venueText {
            width: 100%;
            padding: 20px;
            font-family: "POI Diode", sans-serif;
            font-weight: 700;
            font-size: clamp(40px, 9vw, 130px);
            line-height: .8;
            color: #087AFF;
            text-align: center;
        }


        /* =========================================
           MENU
        ========================================= */

        .menu {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 20px;
        }

        .menu-item {
            position: relative;
            display: block;
            width: max-content;
            max-width: 100%;
            border: 0;
            background: none;
            color: #00FF38;
            font-family: "POI Diode", sans-serif;
            font-size: clamp(48px, 13vw, 150px);
            font-weight: 700;
            line-height: .78;
            letter-spacing: -.04em;
            text-decoration: none;
            text-transform: uppercase;
            cursor: pointer;
            transition:
                transform 100ms ease,
                color 70ms linear;
        }

        /* O preto nunca entra na paleta do menu. */

        .menu-item:nth-child(1) { color: #00FF38; }
        .menu-item:nth-child(2) { color: #087AFF; }
        .menu-item:nth-child(3) { color: #B000FF; }
        .menu-item:nth-child(4) { color: #FF5C00; }
        .menu-item:nth-child(5) { color: #E5FF00; }
        .menu-item:nth-child(6) { color: #00FF38; }


        /* =========================================
           HOVER / TOUCH
        ========================================= */

        .menu-item:hover {
            transform: skewX(-12deg) scaleX(1.08) scaleY(.94);
        }

        .menu-item:active {
            transform: skewX(16deg) scaleX(.88) scaleY(1.08);
        }


        /* =========================================
           FLASH
        ========================================= */

        .flash {
            position: fixed;
            inset: 0;
            background: #FFF;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
        }

        .flash.active {
            animation: flash-effect 100ms linear;
        }

        @keyframes flash-effect {
            0% { opacity: 0; }
            25% { opacity: .8; }
            100% { opacity: 0; }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .intro-line {
                /*
                    Largura quase total da tela, sem cortar.
                    A quantidade de linhas é calculada no JS
                    para que elas se sobreponham como no desktop.
                */
                font-size: 11.5vw;
                line-height: .72;
            }

            #dateText {
                font-size: 14vw;
                padding: 0 3vw;
            }

            #venueText {
                font-size: 9vw;
            }

            .menu {
                gap: 9px;
                padding: 15px;
            }

            .menu-item {
                font-size: 14vw;
            }

        }


        /* =========================================
           TELAS MUITO PEQUENAS
        ========================================= */

        @media (max-height: 650px) {

            .intro-line {
                font-size: 11vw;
            }

            .menu {
                gap: 4px;
            }

            .menu-item {
                font-size: 12vw;
            }

        }

    </style>

</head>


<body>

    <main class="screen">

        <!-- INTRO -->
        <section
            class="scene active"
            id="intro"
        >

            <div
                class="intro-grid"
                id="introGrid"
            >
                <!-- As linhas são criadas pelo JavaScript. -->
            </div>

        </section>


        <!-- DATA -->
        <section
            class="scene"
            id="date"
        >

            <div id="dateText">
                07/11/2026
            </div>

        </section>


        <!-- LOCAL -->
        <section
            class="scene"
            id="venue"
        >

            <div id="venueText">
                BOHÔ BAR &amp; PISTA
            </div>

        </section>


        <!-- MENU -->
        <section
            class="scene"
            id="menu"
        >

            <nav class="menu">

                <a class="menu-item" href="confirme.html">CONFIRME</a>

                <a class="menu-item" href="quemvai.html">QUEM VAI</a>

                <a class="menu-item" href="musica.html">MÚSICA</a>

                <a class="menu-item" href="looks.html">LOOKS</a>

                <a class="menu-item" href="jogos.html">JOGOS</a>

                <a class="menu-item" href="infos.html">INFO</a>

            </nav>

        </section>


        <!-- FLASH -->
        <div
            class="flash"
            id="flash"
        ></div>

    </main>


    <script>

        /* =========================================
           CENAS
        ========================================= */

        const intro = document.getElementById("intro");
        const date = document.getElementById("date");
        const venue = document.getElementById("venue");
        const menu = document.getElementById("menu");
        const introGrid = document.getElementById("introGrid");
        const dateText = document.getElementById("dateText");
        const venueText = document.getElementById("venueText");
        const flash = document.getElementById("flash");


        /* =========================================
           PALETA
        ========================================= */

        const colors = [
            "#087AFF",   // azul
            "#B000FF",   // roxo
            "#FF5C00",   // laranja
            "#00FF38",   // verde
            "#E5FF00"    // amarelo
        ];

        function randomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function isMobile() {
            return window.innerWidth <= 600;
        }


        /* =========================================
           CRIAÇÃO DAS LINHAS

           A quantidade de linhas depende do tamanho
           da fonte e da altura da tela, assim as
           linhas se sobrepõem do mesmo jeito no
           celular e no desktop.

           DENSIDADE: quanto MENOR o número, mais as
           linhas se sobrepõem (0.9 = como no desktop).
        ========================================= */

        const DENSIDADE = 0.9;

        const introLines = [];

        function calcularTotalLinhas() {

            const probe = document.createElement("div");

            probe.className = "intro-line";
            probe.style.position = "absolute";
            probe.style.visibility = "hidden";
            probe.textContent = "SABATINI28";

            introGrid.appendChild(probe);

            const fontSize = parseFloat(
                getComputedStyle(probe).fontSize
            );

            introGrid.removeChild(probe);

            const altura = introGrid.clientHeight || window.innerHeight;

            const total = Math.round(altura / (fontSize * DENSIDADE));

            return Math.max(6, Math.min(total, 24));

        }

        function criarLinhas() {

            introGrid.innerHTML = "";
            introLines.length = 0;

            const total = calcularTotalLinhas();

            for (let i = 0; i < total; i++) {

                const line = document.createElement("div");

                line.className = "intro-line";
                line.textContent = "SABATINI28";
                line.style.color = randomColor();

                introGrid.appendChild(line);
                introLines.push(line);

            }

        }

        criarLinhas();


        /* Recalcula se a tela girar ou mudar de tamanho */

        let resizeTimer;

        window.addEventListener("resize", function () {

            clearTimeout(resizeTimer);

            resizeTimer = setTimeout(function () {

                if (intro.classList.contains("active")) {
                    criarLinhas();
                    animateIntro();
                }

            }, 200);

        });


        /* =========================================
           DEFORMA UMA LINHA
        ========================================= */

        function randomizeLine(line) {

            /*
                No celular a margem lateral é menor,
                então a deformação horizontal é mais
                contida para nunca cortar o SABATINI28.
            */

            const mobile = isMobile();

            const x = mobile ? random(-2, 2) : random(-3, 3);
            const y = random(-1.5, 1.5);
            const rotation = random(-2.5, 2.5);
            const scaleX = mobile ? random(.90, 1.08) : random(.88, 1.12);
            const scaleY = random(.88, 1.12);

            line.style.transform = `
                translate(${x}vw, ${y}vh)
                rotate(${rotation}deg)
                scaleX(${scaleX})
                scaleY(${scaleY})
            `;

            line.style.color = randomColor();

        }


        /* =========================================
           ANIMAÇÃO DA INTRO
        ========================================= */

        function animateIntro() {

            introLines.forEach(function (line) {
                randomizeLine(line);
            });

        }

        /* Começa imediatamente. */

        animateIntro();

        /* Mudanças rápidas, como um letreiro de nightclub. */

        const introInterval = setInterval(function () {

            /* Nem todas as linhas mudam ao mesmo tempo. */

            introLines.forEach(function (line) {

                if (Math.random() < .75) {
                    randomizeLine(line);
                }

            });

            /* Flash ocasional. */

            doFlash();

        }, 250);


        /* =========================================
           FLASH
        ========================================= */

        function doFlash() {

            /* Chance de acontecer. */

            if (Math.random() < .30) {

                flash.classList.remove("active");

                void flash.offsetWidth;

                flash.classList.add("active");

            }

        }


        /* =========================================
           INTRO → DATA
        ========================================= */

        setTimeout(function () {

            clearInterval(introInterval);

            intro.classList.remove("active");

            date.classList.add("active");

            /* Pequena deformação da data. */

            dateText.style.transform = `
                scaleX(${random(.92, 1.05)})
                rotate(${random(-2, 2)}deg)
            `;

            dateText.style.color = randomColor();

            doFlash();

        }, 3200);


        /* =========================================
           DATA → LOCAL
        ========================================= */

        setTimeout(function () {

            date.classList.remove("active");

            venue.classList.add("active");

            venueText.style.color = randomColor();

            venueText.style.transform = `
                scaleX(${random(.85, 1.05)})
                rotate(${random(-3, 3)}deg)
            `;

            doFlash();

        }, 5200);


        /* =========================================
           LOCAL → MENU
        ========================================= */

        setTimeout(function () {

            venue.classList.remove("active");

            menu.classList.add("active");

            doFlash();

            startMenuChaos();

        }, 7200);


        /* =========================================
           MENU CAÓTICO
        ========================================= */

        function startMenuChaos() {

            const items = document.querySelectorAll(".menu-item");

            setInterval(function () {

                items.forEach(function (item) {

                    const rotation = (Math.random() - .5) * 5;
                    const scaleX = .92 + Math.random() * .18;
                    const scaleY = .90 + Math.random() * .18;
                    const x = (Math.random() - .5) * 5;
                    const y = (Math.random() - .5) * 2;

                    item.style.transform = `
                        translate(${x}vw, ${y}vh)
                        rotate(${rotation}deg)
                        scaleX(${scaleX})
                        scaleY(${scaleY})
                    `;

                    /* Nunca preto. */

                    item.style.color = randomColor();

                });

                /* Flash ocasional. */

                if (Math.random() < .25) {
                    doFlash();
                }

            }, 700);

        }


        /* =========================================
           EVITAR "#"
        ========================================= */

        document
            .querySelectorAll('.menu-item[href="#"]')
            .forEach(function (item) {

                item.addEventListener("click", function (event) {
                    event.preventDefault();
                });

            });

    </script>

</body>

</html>
