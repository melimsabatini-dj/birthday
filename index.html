<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>SABATINI28 — LOOKS</title>


    <style>


        /* =========================================
           FONTES
        ========================================= */

        @font-face {

            font-family: "Memesique";

            src:
                url("fonts/Memesique-Regular.woff2")
                format("woff2");

            font-weight: normal;

            font-style: normal;

            font-display: swap;

        }


        @font-face {

            font-family: "Moderat";

            src:
                url("fonts/Moderat-Mono-Light.woff2")
                format("woff2");

            font-weight: 300;

            font-style: normal;

            font-display: swap;

        }



        /* =========================================
           RESET
        ========================================= */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        html,
        body {

            width: 100%;

            min-height: 100%;

            background: #000;

        }


        body {

            overflow-x: hidden;

            background: #000;

        }



        /* =========================================
           PÁGINA
        ========================================= */

        .looks-page {

            position: relative;

            width: 100%;

            min-height: 100vh;

            background: #000;

            padding:
                16px
                16px
                35px;

        }



        /* =========================================
           VOLTAR
        ========================================= */

        .back {

            position: absolute;

            top: 12px;

            left: 14px;

            border: 0;

            background: none;

            color: #FF5C00;

            font-family:
                "Memesique",
                sans-serif;

            font-size: 42px;

            line-height: 1;

            cursor: pointer;

            z-index: 20;

            transition:
                transform 100ms ease,
                color 80ms linear;

        }


        .back:active {

            transform:
                translateX(-8px)
                scale(1.15);

        }



        /* =========================================
           TÍTULO
        ========================================= */

        .title {

            width: 100%;

            margin-top: 52px;

            color: #00FF38;

            font-family:
                "Memesique",
                sans-serif;

            font-size:
                clamp(
                    70px,
                    19vw,
                    200px
                );

            line-height: 0.72;

            letter-spacing: -0.04em;

            text-align: center;

            user-select: none;

        }



        /* =========================================
           BOTÃO GERAR
        ========================================= */

        .generate {

            display: block;

            margin:
                30px auto
                34px;

            padding:
                12px
                24px;

            border:
                4px solid #FF5C00;

            background: #000;

            color: #FF5C00;

            font-family:
                "Memesique",
                sans-serif;

            font-size:
                clamp(
                    25px,
                    6vw,
                    42px
                );

            line-height: 0.9;

            cursor: pointer;

            transition:
                background-color 70ms linear,
                color 70ms linear,
                transform 100ms ease;

        }


        .generate:active {

            background: #FF5C00;

            color: #000;

            transform:
                scaleX(1.10)
                scaleY(0.90);

        }



        /* =========================================
           ÁREA DOS LOOKS
        ========================================= */

        .outfit {

            width: 100%;

            max-width: 900px;

            margin:
                0 auto;

            display: flex;

            flex-direction: column;

            gap: 12px;

        }



        /* =========================================
           CAIXAS
        ========================================= */

        .look-box {

            width: 100%;

            min-height: 78px;

            padding:
                13px
                12px;

            border:
                4px solid #FF5C00;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background: #000;

            /*
                Moderat para as opções.
            */

            color: #00FF38;

            font-family:
                "Moderat",
                monospace;

            font-weight: 300;

            font-size:
                clamp(
                    21px,
                    6vw,
                    48px
                );

            line-height: 1;

            letter-spacing: -0.04em;

            text-align: center;

            text-transform: uppercase;

            user-select: none;

            /*
                IMPORTANTE:
                Começa invisível.
            */

            opacity: 0;

            transition:
                transform 100ms
                cubic-bezier(.2,.8,.2,1),

                color 70ms linear;

        }


        /*
            Quando já foi gerado,
            fica visível.
        */

        .look-box.visible {

            opacity: 1;

        }



        /* =========================================
           ANIMAÇÃO DE EMBARALHAMENTO
        ========================================= */

        .look-box.spinning {

            animation:
                box-shake
                80ms
                infinite;

        }


        @keyframes box-shake {

            0% {

                transform:
                    translateX(-2px)
                    scaleX(1.01);

            }

            50% {

                transform:
                    translateX(2px)
                    scaleX(0.99);

            }

            100% {

                transform:
                    translateX(-2px)
                    scaleX(1.01);

            }

        }



        /* =========================================
           FLASH AO FINALIZAR
        ========================================= */

        .look-box.finished {

            animation:
                finish-box
                180ms
                ease;

        }


        @keyframes finish-box {

            0% {

                transform:
                    scaleX(1)
                    scaleY(1);

            }

            35% {

                transform:
                    scaleX(1.06)
                    scaleY(0.91);

            }

            65% {

                transform:
                    scaleX(0.98)
                    scaleY(1.05);

            }

            100% {

                transform:
                    scaleX(1)
                    scaleY(1);

            }

        }



        /* =========================================
           DESKTOP
        ========================================= */

        @media (min-width: 700px) {

            .looks-page {

                padding:
                    20px
                    30px
                    50px;

            }


            .title {

                margin-top: 45px;

            }


            .generate {

                margin-top: 36px;

                margin-bottom: 38px;

            }


            .outfit {

                gap: 16px;

            }


            .look-box {

                min-height: 90px;

                font-size:
                    clamp(
                        30px,
                        4vw,
                        58px
                    );

            }

        }



        /* =========================================
           CELULARES PEQUENOS
        ========================================= */

        @media (max-width: 380px) {

            .looks-page {

                padding-left: 11px;

                padding-right: 11px;

            }


            .title {

                font-size: 62px;

            }


            .generate {

                margin-top: 24px;

                margin-bottom: 26px;

                border-width: 3px;

            }


            .look-box {

                min-height: 67px;

                border-width: 3px;

                font-size: 19px;

            }


            .outfit {

                gap: 9px;

            }

        }


    </style>

</head>



<body>


    <main class="looks-page">


        <!-- VOLTAR -->

        <button
            class="back"
            onclick="history.back()"
            aria-label="Voltar"
        >
            ←
        </button>



        <!-- TÍTULO -->

        <h1 class="title">
            LOOKS
        </h1>



        <!-- GERAR -->

        <button
            class="generate"
            id="generate"
        >
            GERAR
        </button>



        <!-- RESULTADO -->

        <section
            class="outfit"
            id="outfit"
        >


            <div
                class="look-box"
                id="accessory"
            ></div>


            <div
                class="look-box"
                id="top"
            ></div>


            <div
                class="look-box"
                id="bottom"
            ></div>


            <div
                class="look-box"
                id="shoes"
            ></div>


            <div
                class="look-box"
                id="outer"
            ></div>


        </section>


    </main>



    <script>


        /* =========================================
           BANCO DE LOOKS
        ========================================= */

        const looks = {


            accessory: [

                "óculos escuro",

                "bandana",

                "cigarro na orelha",

                "echarpe",

                "gravata mal atada",

                "correntes",

                "luvas"

            ],


            top: [

                "camiseta branca",

                "camiseta preta",

                "regata branca",

                "regata preta",

                "camisa desabotoada",

                "graphic tee"

            ],


            bottom: [

                "calça de couro",

                "jeans cinza",

                "jorts",

                "calça social",

                "calça de nylon",

                "cintura baixa"

            ],


            shoes: [

                "mocassim",

                "coturno",

                "dad shoes",

                "sapatilha com meia",

                "boston soft",

                "converse"

            ],


            outer: [

                "jaqueta de couro",

                "colete de couro",

                "camisa de manga longa",

                "corta vento",

                "paletó"

            ]

        };



        /* =========================================
           ELEMENTOS
        ========================================= */

        const boxes = {


            accessory:
                document.getElementById(
                    "accessory"
                ),


            top:
                document.getElementById(
                    "top"
                ),


            bottom:
                document.getElementById(
                    "bottom"
                ),


            shoes:
                document.getElementById(
                    "shoes"
                ),


            outer:
                document.getElementById(
                    "outer"
                )

        };


        const generate =
            document.getElementById(
                "generate"
            );



        /* =========================================
           CORES
        ========================================= */

        const colors = [

            "#087AFF",

            "#B000FF",

            "#FF5C00",

            "#00FF38",

            "#E5FF00"

        ];



        /* =========================================
           ESCOLHER ITEM
        ========================================= */

        function randomItem(array) {

            return array[
                Math.floor(
                    Math.random()
                    *
                    array.length
                )
            ];

        }



        /* =========================================
           ESCOLHER COR
        ========================================= */

        function randomColor() {

            return colors[
                Math.floor(
                    Math.random()
                    *
                    colors.length
                )
            ];

        }



        /* =========================================
           EMBARALHAR UMA CAIXA
        ========================================= */

        function spinBox(
            category,
            box,
            delay
        ) {


            setTimeout(function() {


                /*
                    Torna visível
                */

                box.classList.add(
                    "visible"
                );


                /*
                    Começa a tremer
                */

                box.classList.add(
                    "spinning"
                );


                /*
                    Troca rapidamente
                    as opções.
                */

                let counter = 0;


                const totalSpins =
                    10 +
                    Math.floor(
                        Math.random() * 7
                    );


                const speed = 65;


                const spinner =
                    setInterval(function() {


                        box.textContent =
                            randomItem(
                                looks[category]
                            ).toUpperCase();


                        box.style.color =
                            randomColor();


                        counter++;


                        /*
                            Depois de algumas
                            trocas, para.
                        */

                        if (
                            counter >=
                            totalSpins
                        ) {


                            clearInterval(
                                spinner
                            );


                            /*
                                Resultado final
                            */

                            box.textContent =
                                randomItem(
                                    looks[category]
                                ).toUpperCase();


                            box.style.color =
                                randomColor();


                            box.classList.remove(
                                "spinning"
                            );


                            /*
                                Pequeno impacto
                                ao parar.
                            */

                            box.classList.add(
                                "finished"
                            );


                            setTimeout(function() {

                                box.classList.remove(
                                    "finished"
                                );

                            }, 180);

                        }


                    }, speed);


            }, delay);

        }



        /* =========================================
           GERAR LOOK COMPLETO
        ========================================= */

        function generateLook() {


            /*
                Cada caixa começa
                em um momento diferente.
            */

            spinBox(
                "accessory",
                boxes.accessory,
                0
            );


            spinBox(
                "top",
                boxes.top,
                160
            );


            spinBox(
                "bottom",
                boxes.bottom,
                320
            );


            spinBox(
                "shoes",
                boxes.shoes,
                480
            );


            spinBox(
                "outer",
                boxes.outer,
                640
            );


            /*
                Reação do botão
            */

            generate.style.transform =
                "scaleX(1.12) scaleY(.88)";


            setTimeout(function() {

                generate.style.transform =
                    "";

            }, 120);

        }



        /* =========================================
           IMPORTANTE:
           
           NÃO chamamos generateLook()
           aqui.

           As caixas permanecem vazias
           até o primeiro clique.
        ========================================= */

        generate.addEventListener(
            "click",
            generateLook
        );



        /* =========================================
           INTERAÇÃO DESKTOP
        ========================================= */

        Object.values(boxes)
            .forEach(function(box) {


                box.addEventListener(
                    "mousemove",
                    function(event) {


                        if (
                            box.classList.contains(
                                "spinning"
                            )
                        ) {

                            return;

                        }


                        const rect =
                            box.getBoundingClientRect();


                        const x =
                            event.clientX -
                            rect.left;


                        const percentage =
                            x /
                            rect.width;


                        const rotation =
                            (
                                percentage -
                                0.5
                            )
                            * 5;


                        box.style.transform = `

                            skewX(
                                ${rotation}deg
                            )

                            scaleX(1.015)

                        `;

                    }
                );


                box.addEventListener(
                    "mouseleave",
                    function() {

                        if (
                            !box.classList.contains(
                                "spinning"
                            )
                        ) {

                            box.style.transform =
                                "";

                        }

                    }
                );


                /* =================================
                   MOBILE
                ================================= */

                box.addEventListener(
                    "touchstart",
                    function() {

                        box.style.transform =
                            "scaleX(1.025) scaleY(.96)";

                    },
                    {
                        passive: true
                    }
                );


                box.addEventListener(
                    "touchend",
                    function() {

                        setTimeout(function() {

                            box.style.transform =
                                "";

                        }, 100);

                    }
                );

            });


    </script>

</body>

</html>
