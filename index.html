<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SABATINI28</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: Arial Black, Arial, sans-serif;
            cursor: crosshair;
        }


        /* =========================
           ÁREA PRINCIPAL
        ========================= */

        .menu {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #000;

            transition:
                background-color 80ms linear;
        }


        /* =========================
           PALAVRAS
        ========================= */

        .item {

            position: absolute;

            display: block;

            font-family:
                "Arial Black",
                Arial,
                sans-serif;

            font-weight: 900;

            line-height: 0.78;

            white-space: nowrap;

            user-select: none;

            cursor: pointer;

            transform-origin: center center;

            /* Nunca começa preta */
            color: #087AFF;

            z-index: 2;

            will-change:
                transform,
                color;

            transition:
                transform 140ms cubic-bezier(.2,.8,.2,1),
                color 80ms linear;

        }


        /* =========================
           TAMANHOS
        ========================= */

        .confirme {
            font-size: clamp(70px, 10vw, 150px);
        }

        .quem {
            font-size: clamp(65px, 9vw, 140px);
        }

        .musica {
            font-size: clamp(65px, 10vw, 160px);
        }

        .look {
            font-size: clamp(90px, 13vw, 210px);
        }

        .jogue {
            font-size: clamp(70px, 11vw, 170px);
        }

        .local {
            font-size: clamp(65px, 9vw, 140px);
        }

        .segredos {
            font-size: clamp(55px, 7vw, 110px);
        }

        .sabatini {
            font-size: clamp(50px, 6vw, 100px);
        }


        /* =========================
           POSIÇÕES
        ========================= */

        .confirme {
            left: 3vw;
            top: 6vh;
        }

        .quem {
            left: 5vw;
            top: 30vh;
        }

        .musica {
            right: 3vw;
            bottom: 7vh;
        }

        .look {
            right: 7vw;
            top: 14vh;
        }

        .jogue {
            left: 34vw;
            bottom: 10vh;
        }

        .local {
            left: 4vw;
            bottom: 6vh;
        }

        .segredos {
            right: 42vw;
            top: 48vh;

            writing-mode: vertical-rl;

            font-size: clamp(45px, 6vw, 100px);
        }

        .sabatini {
            right: 3vw;
            top: 43vh;
        }


        /* =========================
           HOVER
        ========================= */

        .item:hover {
            z-index: 20;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .confirme {
                left: 2vw;
                top: 7vh;
            }

            .quem {
                left: 3vw;
                top: 27vh;
            }

            .look {
                right: 2vw;
                top: 15vh;
            }

            .musica {
                right: 2vw;
                bottom: 7vh;
            }

            .jogue {
                left: 8vw;
                bottom: 20vh;
            }

            .local {
                left: 3vw;
                bottom: 7vh;
            }

            .segredos {
                right: 20vw;
                top: 45vh;
            }

            .sabatini {
                right: 2vw;
                top: 43vh;
            }

        }

    </style>
</head>


<body>


    <main class="menu" id="menu">


        <div
            class="item confirme"
            data-type="escape">
            CONFIRME
        </div>


        <div
            class="item quem"
            data-type="shake">
            QUEM VEM
        </div>


        <div
            class="item musica"
            data-type="pulse">
            MÚSICA
        </div>


        <div
            class="item look"
            data-type="stretch">
            LOOK
        </div>


        <div
            class="item jogue"
            data-type="escape">
            JOGUE
        </div>


        <div
            class="item local"
            data-type="tilt">
            LOCAL
        </div>


        <div
            class="item segredos"
            data-type="shake">
            SEGREDOS
        </div>


        <div
            class="item sabatini"
            data-type="stretch">
            SABATINI28
        </div>


    </main>



    <script>


        const menu =
            document.getElementById("menu");


        const items =
            document.querySelectorAll(".item");


        /* =========================
           PALETA

           IMPORTANTE:
           PRETO NÃO ESTÁ AQUI.
        ========================= */

        const colors = [

            "#087AFF",
            "#B000FF",
            "#FF5C00",
            "#00FF38",
            "#E5FF00"

        ];


        let mouseX = -1000;
        let mouseY = -1000;



        /* =========================
           MOUSE
        ========================= */

        document.addEventListener(
            "mousemove",
            function(event) {

                mouseX = event.clientX;
                mouseY = event.clientY;

            }
        );



        /* =========================
           INTERAÇÃO
        ========================= */

        function animateItems() {


            items.forEach(function(item) {


                const rect =
                    item.getBoundingClientRect();


                const centerX =
                    rect.left +
                    rect.width / 2;


                const centerY =
                    rect.top +
                    rect.height / 2;


                const distance =
                    Math.sqrt(

                        Math.pow(
                            mouseX - centerX,
                            2
                        )

                        +

                        Math.pow(
                            mouseY - centerY,
                            2
                        )

                    );


                /*
                    Área de influência
                */

                const radius = 280;


                let influence =
                    1 - distance / radius;


                influence =
                    Math.max(
                        0,
                        Math.min(
                            1,
                            influence
                        )
                    );


                const type =
                    item.dataset.type;



                /* =====================
                   SEM INTERAÇÃO
                ===================== */

                if (influence <= 0) {

                    item.style.transform =
                        "translate(0,0) scaleX(1) scaleY(1) rotate(0deg)";

                    return;

                }



                /* =====================
                   FOGE DO MOUSE
                ===================== */

                if (type === "escape") {


                    const angle =
                        Math.atan2(
                            centerY - mouseY,
                            centerX - mouseX
                        );


                    const force =
                        influence * 45;


                    const x =
                        Math.cos(angle) *
                        force;


                    const y =
                        Math.sin(angle) *
                        force;


                    item.style.transform = `

                        translate(
                            ${x}px,
                            ${y}px
                        )

                        scaleX(
                            ${1 + influence * 0.15}
                        )

                        rotate(
                            ${influence * 4}deg
                        )

                    `;

                }



                /* =====================
                   TREME
                ===================== */

                if (type === "shake") {


                    const x =
                        (Math.random() - 0.5)
                        *
                        influence
                        *
                        12;


                    const y =
                        (Math.random() - 0.5)
                        *
                        influence
                        *
                        12;


                    const rotation =
                        (Math.random() - 0.5)
                        *
                        influence
                        *
                        7;


                    item.style.transform = `

                        translate(
                            ${x}px,
                            ${y}px
                        )

                        rotate(
                            ${rotation}deg
                        )

                    `;

                }



                /* =====================
                   PULSA
                ===================== */

                if (type === "pulse") {


                    const scale =
                        1 +
                        influence *
                        0.25;


                    item.style.transform = `

                        scale(
                            ${scale}
                        )

                        skewX(
                            ${influence * 6}deg
                        )

                    `;

                }



                /* =====================
                   ESTICA
                ===================== */

                if (type === "stretch") {


                    const scaleX =
                        1 +
                        influence *
                        0.7;


                    const scaleY =
                        1 -
                        influence *
                        0.12;


                    item.style.transform = `

                        scaleX(
                            ${scaleX}
                        )

                        scaleY(
                            ${scaleY}
                        )

                    `;

                }



                /* =====================
                   ENTORTA
                ===================== */

                if (type === "tilt") {


                    const direction =
                        mouseX >
                        centerX
                            ? 1
                            : -1;


                    item.style.transform = `

                        rotate(
                            ${direction *
                            influence *
                            14}deg
                        )

                        scaleX(
                            ${1 +
                            influence *
                            0.15}
                        )

                    `;

                }


            });


            requestAnimationFrame(
                animateItems
            );

        }


        animateItems();



        /* =========================
           CORES INICIAIS
           
           TODAS AS CORES SÃO
           DIFERENTES DE PRETO.
        ========================= */

        items.forEach(function(item) {

            const color =
                colors[
                    Math.floor(
                        Math.random()
                        *
                        colors.length
                    )
                ];


            item.style.color =
                color;

        });



        /* =========================
           FLASHES
        ========================= */

        function flash() {


            const item =
                items[
                    Math.floor(
                        Math.random()
                        *
                        items.length
                    )
                ];


            const color =
                colors[
                    Math.floor(
                        Math.random()
                        *
                        colors.length
                    )
                ];


            /*
                Flash normal:
                apenas o texto muda.
            */

            item.style.color =
                color;



            /*
                Pequena chance de
                flash no fundo.
            */

            if (Math.random() < 0.12) {


                menu.style.backgroundColor =
                    color;


                /*
                    AGORA sim o preto
                    pode aparecer no texto,
                    porque o fundo NÃO é preto.
                */

                items.forEach(function(word) {

                    word.dataset.previousColor =
                        word.style.color;

                    word.style.color =
                        "#000000";

                });


                setTimeout(function() {


                    menu.style.backgroundColor =
                        "#000000";


                    /*
                        Restauramos as cores
                        vibrantes anteriores.
                    */

                    items.forEach(function(word) {

                        word.style.color =
                            word.dataset.previousColor
                            ||
                            colors[
                                Math.floor(
                                    Math.random()
                                    *
                                    colors.length
                                )
                            ];

                    });


                }, 90);

            }


            setTimeout(
                flash,
                350 +
                Math.random() *
                1100
            );

        }


        flash();



        /* =========================
           CLIQUE
        ========================= */

        items.forEach(function(item) {


            item.addEventListener(
                "click",
                function() {


                    item.style.color =
                        "#ffffff";


                    item.style.transform = `

                        scale(
                            1.35
                        )

                        rotate(
                            ${
                                Math.random()
                                * 10
                                - 5
                            }deg
                        )

                    `;


                    setTimeout(function() {


                        /*
                            Volta para uma cor
                            vibrante, nunca preto.
                        */

                        item.style.color =
                            colors[
                                Math.floor(
                                    Math.random()
                                    *
                                    colors.length
                                )
                            ];


                    }, 180);


                }
            );

        });


    </script>

</body>
</html>
