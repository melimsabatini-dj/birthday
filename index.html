<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SABATINI28</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            font-family: Arial Black, Arial, sans-serif;
        }

        .screen {
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            transition:
                background-color 0.05s linear;
        }

        .logo {
            color: #fff;

            font-family: "Arial Black", Arial, sans-serif;
            font-size: clamp(80px, 18vw, 320px);

            line-height: 0.75;
            letter-spacing: -0.08em;

            white-space: nowrap;

            text-align: center;

            user-select: none;

            transform:
                scaleX(1)
                scaleY(1)
                rotate(0deg)
                skewX(0deg);

            transition:
                transform 0.08s linear,
                color 0.05s linear;
        }

        /* Reduz movimento para quem prefere menos animação */
        @media (prefers-reduced-motion: reduce) {

            .screen {
                background: #000 !important;
            }

            .logo {
                color: #fff !important;
                transform: none !important;
                transition: none !important;
            }

        }

    </style>
</head>

<body>

    <main class="screen" id="screen">

        <div class="logo" id="logo">
            SABATINI28
        </div>

    </main>


    <script>

        const screen = document.getElementById("screen");
        const logo = document.getElementById("logo");


        const colors = [

            "#000000",
            "#087AFF",
            "#B000FF",
            "#FF9500",
            "#00FF22",
            "#E5FF00"

        ];


        const textColors = [

            "#FFFFFF",
            "#000000"

        ];


        function random(min, max) {

            return Math.random() * (max - min) + min;

        }


        function chaos() {

            // Escolhe uma cor aleatória

            const backgroundColor =
                colors[Math.floor(Math.random() * colors.length)];


            const textColor =
                textColors[Math.floor(Math.random() * textColors.length)];


            // Muda o fundo

            screen.style.backgroundColor = backgroundColor;


            // Muda a cor do texto

            logo.style.color = textColor;


            // Distorções

            const scaleX = random(0.35, 2.2);

            const scaleY = random(0.5, 1.8);

            const rotate = random(-8, 8);

            const skew = random(-15, 15);


            logo.style.transform = `
                scaleX(${scaleX})
                scaleY(${scaleY})
                rotate(${rotate}deg)
                skewX(${skew}deg)
            `;


            // Próximo flash

            const nextChange = random(120, 650);

            setTimeout(chaos, nextChange);

        }


        chaos();

    </script>

</body>
</html>
