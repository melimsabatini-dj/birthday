
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>QUIZ VALE XOTÃO - SABATINI28</title>


    <style>

        /* =========================================
           FONTES
        ========================================= */

        @font-face {
            font-family: "POI Diode";
            src: url("fonts/POIDiodeTrial-Bold.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Moderat";
            src: url("fonts/Moderat-Mono-Light.woff2") format("woff2");
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }


        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            overflow-x: hidden;
            background: #000;
        }


        /* =========================================
           PÁGINA
        ========================================= */

        .quiz-page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: #000;
            padding: 16px 16px 45px;
        }

        @media (min-width: 700px) {
            .quiz-page {
                padding: 20px 30px 60px;
            }
        }

        @media (max-width: 380px) {
            .quiz-page {
                padding-left: 11px;
                padding-right: 11px;
            }
        }


        /* =========================================
           VOLTAR
        ========================================= */

        .back {
            position: absolute;
            top: 12px;
            left: 14px;
            border: 0;
            background: none;
            color: #FF5C00;
            font-family: "POI Diode", sans-serif;
            font-size: 42px;
            line-height: 1;
            cursor: pointer;
            z-index: 20;
            transition:
                transform 100ms ease,
                color 80ms linear;
        }

        .back:active {
            transform: translateX(-8px) scale(1.15);
        }


        /* =========================================
           TÍTULO
        ========================================= */

        .title {
            width: 100%;
            margin-top: 52px;
            color: #00FF38;
            font-family: "POI Diode", sans-serif;
            font-size: clamp(60px, 17vw, 180px);
            line-height: 0.72;
            letter-spacing: -0.04em;
            text-align: center;
            user-select: none;
            margin-bottom: 36px;
        }

        @media (max-width: 380px) {
            .title {
                font-size: 56px;
            }
        }


        /* =========================================
           CONTEÚDO
        ========================================= */

        .quiz-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-label {
            color: #087AFF;
            font-family: "POI Diode", sans-serif;
            font-size: clamp(18px, 5vw, 28px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            user-select: none;
        }


        /* =========================================
           CAIXA DA PERGUNTA
        ========================================= */

        .question-box {
            width: 100%;
            min-height: 140px;
            padding: 20px 14px;
            border: 4px solid #FF5C00;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #00FF38;
            font-family: "Moderat", monospace;
            font-weight: 300;
            font-size: clamp(20px, 5.5vw, 40px);
            line-height: 1.3;
            letter-spacing: -0.04em;
            text-align: center;
            text-transform: uppercase;
            user-select: none;
            overflow: hidden;
        }

        .question-box.spinning {
            animation: box-shake 80ms infinite;
        }

        @keyframes box-shake {
            0%   { transform: translateX(-2px) scaleX(1.01); }
            50%  { transform: translateX(2px) scaleX(0.99); }
            100% { transform: translateX(-2px) scaleX(1.01); }
        }

        .question-box.finished {
            animation: finish-box 180ms ease;
        }

        @keyframes finish-box {
            0%   { transform: scaleX(1) scaleY(1); }
            35%  { transform: scaleX(1.06) scaleY(0.91); }
            65%  { transform: scaleX(0.98) scaleY(1.05); }
            100% { transform: scaleX(1) scaleY(1); }
        }

        @media (max-width: 380px) {
            .question-box {
                border-width: 3px;
                min-height: 120px;
                font-size: 19px;
            }
        }


        /* =========================================
           RESPOSTA
        ========================================= */

        .answer-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-field {
            width: 100%;
            min-height: 78px;
            padding: 13px 12px;
            border: 4px solid #FF5C00;
            background: #000;
            color: #00FF38;
            font-family: "Moderat", monospace;
            font-size: clamp(18px, 5vw, 32px);
            font-weight: 300;
            text-transform: uppercase;
            outline: none;
            border-radius: 0;
            transition:
                border-color 100ms ease,
                box-shadow 100ms ease;
        }

        .input-field::placeholder {
            color: #FF5C00;
            opacity: 0.6;
        }

        .input-field:focus {
            border-color: #00FF38;
            box-shadow: 0 0 12px rgba(0, 255, 56, 0.3);
        }

        .input-field.error {
            border-color: #FF5C00;
            box-shadow: 0 0 12px rgba(255, 92, 0, 0.5);
        }

        .input-field:disabled {
            opacity: 0.5;
        }

        @media (max-width: 380px) {
            .input-field {
                min-height: 67px;
                border-width: 3px;
                font-size: 17px;
            }
        }

        .error-message {
            color: #FF5C00;
            font-family: "Moderat", monospace;
            font-size: clamp(12px, 3vw, 16px);
            font-weight: 300;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 200ms ease;
        }

        .error-message.show {
            opacity: 1;
        }


        /* =========================================
           BOTÃO RESPONDER
        ========================================= */

        .submit-btn {
            display: block;
            width: 100%;
            padding: 12px 24px;
            border: 4px solid #B000FF;
            background: #000;
            color: #B000FF;
            font-family: "POI Diode", sans-serif;
            font-size: clamp(25px, 6vw, 42px);
            font-weight: 700;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            cursor: pointer;
            border-radius: 0;
            transition:
                background-color 70ms linear,
                color 70ms linear,
                transform 100ms ease,
                opacity 200ms ease;
            margin-top: 4px;
        }

        .submit-btn:active {
            background: #B000FF;
            color: #000;
            transform: scaleX(1.10) scaleY(0.90);
        }

        .submit-btn.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 380px) {
            .submit-btn {
                border-width: 3px;
            }
        }


        /* =========================================
           RESULTADO
        ========================================= */

        .resultado {
            width: 100%;
            margin-top: 18px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
        }

        .resultado.show {
            opacity: 1;
            animation: pop 260ms cubic-bezier(.2, .8, .2, 1);
        }

        @keyframes pop {
            0%   { transform: scale(.6) rotate(-6deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .resultado-titulo {
            font-family: "POI Diode", sans-serif;
            font-weight: 700;
            font-size: clamp(34px, 10vw, 90px);
            line-height: 0.85;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            color: #FF5C00;
        }

        .resultado.win .resultado-titulo {
            animation: win-colors 700ms steps(1) infinite;
        }

        @keyframes win-colors {
            0%   { color: #00FF38; }
            20%  { color: #E5FF00; }
            40%  { color: #FF5C00; }
            60%  { color: #087AFF; }
            80%  { color: #B000FF; }
            100% { color: #00FF38; }
        }

        .resultado-sub {
            margin-top: 18px;
            color: #B000FF;
            font-family: "Moderat", monospace;
            font-weight: 300;
            font-size: clamp(16px, 4.5vw, 28px);
            line-height: 1.4;
            letter-spacing: -0.03em;
            text-transform: uppercase;
        }


        /* =========================================
           CONFETE (canvas criado pelo JavaScript)
        ========================================= */

        .fx-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }


        /* =========================================
           CARINHAS TRISTES SUBINDO
        ========================================= */

        .sad-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 50;
        }

        .sad-face {
            position: absolute;
            bottom: -150px;
            opacity: 0;
            animation-name: sad-rise;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        .sad-face svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        @keyframes sad-rise {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(-10deg);
            }
            10% {
                opacity: 1;
            }
            50% {
                transform: translate(3vw, -60vh) rotate(9deg);
            }
            100% {
                opacity: .9;
                transform: translate(-3vw, -130vh) rotate(-8deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .resultado.win .resultado-titulo {
                animation: none;
                color: #00FF38;
            }

            .resultado.show {
                animation: none;
            }

        }

    </style>

</head>


<body>

    <main class="quiz-page">

        <!-- VOLTAR -->
        <button
            class="back"
            onclick="history.back()"
            aria-label="Voltar"
        >
            ←
        </button>


        <!-- TÍTULO -->
        <h1 class="title">
            QUIZ VALE<br>XOTÃO
        </h1>


        <div class="quiz-container">

            <!-- PERGUNTA -->
            <div class="input-label">
                Pergunta
            </div>

            <div
                class="question-box"
                id="question"
            ></div>


            <!-- RESPOSTA -->
            <form
                id="quizForm"
                autocomplete="off"
            >

                <div class="answer-group">

                    <label
                        class="input-label"
                        for="answer"
                    >
                        Sua resposta
                    </label>

                    <input
                        type="text"
                        id="answer"
                        class="input-field"
                        placeholder="digite aqui"
                        maxlength="60"
                        autocomplete="off"
                        autocapitalize="off"
                        autocorrect="off"
                        spellcheck="false"
                        enterkeyhint="send"
                        disabled
                    >

                    <div
                        class="error-message"
                        id="answerError"
                    >
                        Digite uma resposta!
                    </div>

                </div>

                <button
                    type="submit"
                    class="submit-btn"
                    id="submitBtn"
                    disabled
                >
                    RESPONDER
                </button>

            </form>


            <!-- RESULTADO -->
            <section
                class="resultado"
                id="resultado"
            >

                <div
                    class="resultado-titulo"
                    id="resultadoTitulo"
                ></div>

                <p
                    class="resultado-sub"
                    id="resultadoSub"
                ></p>

            </section>

        </div>

    </main>


    <script>

        /* =========================================
           PERGUNTAS E RESPOSTAS ACEITAS

           "r" é a lista de respostas que valem.
           Maiúsculas, acentos e pontuação não importam,
           e um errinho de digitação em respostas de
           5 letras ou mais também é aceito.
        ========================================= */

        const perguntas = [

            { p: "QUAL É MINHA CANTORA FAVORITA?",
              r: ["Lady Gaga", "Gaga"] },

            { p: "QUAL É MEU ÁLBUM FAVORITO DA LADY GAGA?",
              r: ["Born This Way", "BTW"] },

            { p: "EM QUE ANO EU NASCI?",
              r: ["1998"] },

            { p: "QUAL É MEU ASCENDENTE?",
              r: ["Touro"] },

            { p: "QUAL É MEU FILME DE TERROR PREFERIDO?",
              r: ["It", "It a coisa"] },

            { p: "QUAL É MINHA SÉRIE PREFERIDA?",
              r: ["American Horror Story", "AHS"] },

            { p: "QUAL É MEU NÚMERO DA SORTE?",
              r: ["8"] },

            { p: "QUAL É O NOME DA MINHA IRMÃ QUE MOROU NO BRASIL EM 2016?",
              r: ["Lucca"] },

            { p: "QUAL É MINHA COZINHA PREFERIDA DE COZINHAR?",
              r: ["Indiana", "Índia"] },

            { p: "EM QUAL ANO EU ENTREI NO DESIGN?",
              r: ["2017"] },

            { p: "CITE UM ÁLBUM QUE EU TENHO TATUADO.",
              r: ["ARTPOP", "Mayhem"] },

            { p: "QUAL É MINHA SOBREMESA PREFERIDA?",
              r: ["Alfajor"] },

            { p: "QUAL É MEU APELIDO MAIS USADO PELAS PESSOAS?",
              r: ["Saba"] },

            { p: "QUAL ERA O NOME DO MEU ÁLBUM DO TCC?",
              r: ["Berlin Nights"] },

            { p: "QUAL ERA O NOME DO MEU PRIMEIRO NAMORADO?",
              r: ["João", "João Brito"] },

            { p: "QUAL É MEU DESENHO FAVORITO?",
              r: ["Scooby", "Scooby Doo", "Scooby-Doo"] },

            { p: "QUAL ERA O NOME DO PRÉDIO ONDE EU MORAVA NO ITACORUBI?",
              r: ["Las Vegas"] },

            { p: "QUAL CIDADE EU MOREI POR QUATRO ANOS?",
              r: ["Berlim", "Berlin"] },

            { p: "QUAL É A MINHA SEGUNDA CANTORA MAIS OUVIDA?",
              r: ["Charli xcx", "Charli"] },

            { p: "QUANTOS ANOS EU VOU TER EM MAIO DE 2052?",
              r: ["53"] }

        ];


        /* =========================================
           ELEMENTOS
        ========================================= */

        const questionBox = document.getElementById("question");
        const form = document.getElementById("quizForm");
        const answerInput = document.getElementById("answer");
        const answerError = document.getElementById("answerError");
        const submitBtn = document.getElementById("submitBtn");
        const resultado = document.getElementById("resultado");
        const resultadoTitulo = document.getElementById("resultadoTitulo");
        const resultadoSub = document.getElementById("resultadoSub");

        const reduzirMovimento =
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;


        /* =========================================
           PALETA
        ========================================= */

        const colors = [
            "#087AFF",
            "#B000FF",
            "#FF5C00",
            "#00FF38",
            "#E5FF00"
        ];

        function randomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }


        /* =========================================
           MEMÓRIA DO JOGADOR

           Guarda no próprio aparelho qual pergunta
           saiu e se a pessoa já respondeu. Assim,
           recarregar a página não sorteia outra
           pergunta nem dá outra chance.

           Para testar do zero, abra a página com
           ?reset no final do endereço:
           quiz.html?reset
        ========================================= */

        const CHAVE = "sabatini_quiz";

        function lerEstado() {

            try {
                return JSON.parse(localStorage.getItem(CHAVE));
            } catch (e) {
                return null;
            }

        }

        function gravarEstado(estado) {

            try {
                localStorage.setItem(CHAVE, JSON.stringify(estado));
            } catch (e) { }

        }

        if (window.location.search.indexOf("reset") !== -1) {

            try {
                localStorage.removeItem(CHAVE);
            } catch (e) { }

            window.location.replace(window.location.pathname);

        }


        /* =========================================
           CONFERIR A RESPOSTA
        ========================================= */

        function normalizar(texto) {

            return texto
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]+/g, " ")
                .trim();

        }

        /* Número de letras diferentes entre duas palavras */

        function distancia(a, b) {

            const linhas = [];

            for (let i = 0; i <= a.length; i++) {
                linhas[i] = [i];
            }

            for (let j = 0; j <= b.length; j++) {
                linhas[0][j] = j;
            }

            for (let i = 1; i <= a.length; i++) {

                for (let j = 1; j <= b.length; j++) {

                    const custo = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;

                    linhas[i][j] = Math.min(
                        linhas[i - 1][j] + 1,
                        linhas[i][j - 1] + 1,
                        linhas[i - 1][j - 1] + custo
                    );

                }

            }

            return linhas[a.length][b.length];

        }

        function confere(resposta, aceitas) {

            const digitado = normalizar(resposta);

            if (digitado === "") return false;

            return aceitas.some(function (aceita) {

                const certa = normalizar(aceita);

                if (digitado === certa) return true;

                /* Números e respostas curtas: só vale exato */

                if (certa.length < 5 || /^[0-9 ]+$/.test(certa)) {
                    return false;
                }

                /* Tolera um errinho (dois, nas respostas longas) */

                const tolerancia = certa.length >= 10 ? 2 : 1;

                return distancia(digitado, certa) <= tolerancia;

            });

        }


        /* =========================================
           CONFETE
           Explosão a partir do resultado
           + chuva vinda do topo, nas cores do site.
        ========================================= */

        function launchConfetti() {

            if (reduzirMovimento) return;

            const canvas = document.createElement("canvas");

            canvas.className = "fx-canvas";

            document.body.appendChild(canvas);

            const ctx = canvas.getContext("2d");

            const dpr = window.devicePixelRatio || 1;

            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const rect = resultado.getBoundingClientRect();

            const originX = rect.left + rect.width / 2;

            const originY = Math.min(
                Math.max(rect.top + rect.height / 2, 0),
                window.innerHeight
            );

            const pecas = [];

            /* Explosão */

            for (let i = 0; i < 130; i++) {

                const angulo = random(-Math.PI * 0.95, -Math.PI * 0.05);
                const velocidade = random(7, 18);

                pecas.push({
                    x: originX,
                    y: originY,
                    vx: Math.cos(angulo) * velocidade,
                    vy: Math.sin(angulo) * velocidade,
                    w: random(8, 18),
                    h: random(4, 10),
                    rot: random(0, Math.PI * 2),
                    vr: random(-.3, .3),
                    cor: randomColor()
                });

            }

            /* Chuva do topo */

            for (let i = 0; i < 70; i++) {

                pecas.push({
                    x: random(0, window.innerWidth),
                    y: random(-400, -20),
                    vx: random(-1, 1),
                    vy: random(2, 5),
                    w: random(8, 16),
                    h: random(4, 9),
                    rot: random(0, Math.PI * 2),
                    vr: random(-.25, .25),
                    cor: randomColor()
                });

            }

            const duracao = 4200;
            const inicio = performance.now();

            function quadro(agora) {

                const t = agora - inicio;

                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

                const restante = duracao - t;

                ctx.globalAlpha =
                    restante < 900 ? Math.max(restante / 900, 0) : 1;

                pecas.forEach(function (p) {

                    p.vy += .28;
                    p.vx *= .992;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rot += p.vr;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.fillStyle = p.cor;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();

                });

                if (t < duracao) {
                    requestAnimationFrame(quadro);
                } else {
                    canvas.remove();
                }

            }

            requestAnimationFrame(quadro);

        }


        /* =========================================
           CARINHAS TRISTES SUBINDO
           Desenhadas em SVG com traço grosso,
           nas cores do site.
        ========================================= */

        const carinhaTriste = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="44" fill="none"
                    stroke="currentColor" stroke-width="8"/>
                <circle cx="35" cy="42" r="6" fill="currentColor"/>
                <circle cx="65" cy="42" r="6" fill="currentColor"/>
                <path d="M30 72 Q50 54 70 72" fill="none"
                    stroke="currentColor" stroke-width="8"
                    stroke-linecap="round"/>
                <path d="M33 52 Q27 61 33 65 Q39 61 33 52 Z"
                    fill="currentColor"/>
            </svg>
        `;

        function launchSadFaces() {

            if (reduzirMovimento) return;

            const camada = document.createElement("div");

            camada.className = "sad-layer";

            document.body.appendChild(camada);

            const total = 24;

            for (let i = 0; i < total; i++) {

                const face = document.createElement("div");

                const tamanho = Math.round(random(44, 110));

                face.className = "sad-face";
                face.innerHTML = carinhaTriste;

                face.style.width = tamanho + "px";
                face.style.height = tamanho + "px";
                face.style.left = random(0, 92) + "vw";
                face.style.color = randomColor();
                face.style.animationDuration = random(3.6, 6) + "s";
                face.style.animationDelay = random(0, 2.2) + "s";

                camada.appendChild(face);

            }

            setTimeout(function () {
                camada.remove();
            }, 9000);

        }


        /* =========================================
           MOSTRAR O RESULTADO
        ========================================= */

        function mostrarResultado(acertou) {

            if (acertou) {

                resultado.classList.add("win");

                resultadoTitulo.textContent = "VOCÊ GANHOU UM XOTÃO!";

                resultadoSub.textContent = "MANDE UM PRINT PRA MIM PRA UTILIZAR";

            } else {

                resultado.classList.remove("win");

                resultadoTitulo.textContent = "A IGNORÂNCIA É UMA BENÇÃO!";

                resultadoSub.textContent = "MAIS SORTE DA PRÓXIMA VEZ...";

            }

            resultado.classList.add("show");

            resultado.scrollIntoView({
                behavior: reduzirMovimento ? "auto" : "smooth",
                block: "center"
            });

            /* Espera a rolagem terminar para o confete sair do lugar certo */

            setTimeout(function () {

                if (acertou) {
                    launchConfetti();
                } else {
                    launchSadFaces();
                }

            }, reduzirMovimento ? 0 : 350);

        }


        /* =========================================
           TRAVAR O FORMULÁRIO
        ========================================= */

        function travarFormulario() {

            answerInput.disabled = true;

            submitBtn.disabled = true;

            submitBtn.classList.add("hidden");

        }

        function liberarFormulario() {

            answerInput.disabled = false;

            submitBtn.disabled = false;

        }


        /* =========================================
           MOSTRAR A PERGUNTA
           (com um sorteio animado quando é nova)
        ========================================= */

        let indiceAtual = 0;

        function mostrarPergunta(indice, animar, aoTerminar) {

            indiceAtual = indice;

            if (!animar) {

                questionBox.textContent = perguntas[indice].p;

                questionBox.style.color = "#00FF38";

                if (aoTerminar) aoTerminar();

                return;

            }

            questionBox.classList.add("spinning");

            let contador = 0;

            const total = 14;

            const sorteio = setInterval(function () {

                const aleatoria =
                    perguntas[Math.floor(Math.random() * perguntas.length)];

                questionBox.textContent = aleatoria.p;

                questionBox.style.color = randomColor();

                contador++;

                if (contador >= total) {

                    clearInterval(sorteio);

                    questionBox.textContent = perguntas[indice].p;

                    questionBox.style.color = "#00FF38";

                    questionBox.classList.remove("spinning");

                    questionBox.classList.add("finished");

                    setTimeout(function () {
                        questionBox.classList.remove("finished");
                    }, 180);

                    if (aoTerminar) aoTerminar();

                }

            }, 70);

        }


        /* =========================================
           INÍCIO
        ========================================= */

        const salvo = lerEstado();

        if (
            salvo &&
            typeof salvo.id === "number" &&
            perguntas[salvo.id]
        ) {

            /* Já jogou (ou já viu a pergunta) neste aparelho */

            if (salvo.status === "win" || salvo.status === "lose") {

                mostrarPergunta(salvo.id, false);

                travarFormulario();

                mostrarResultado(salvo.status === "win");

            } else {

                mostrarPergunta(salvo.id, false, liberarFormulario);

            }

        } else {

            /* Jogador novo: sorteia uma pergunta e guarda */

            const novoId = Math.floor(Math.random() * perguntas.length);

            gravarEstado({ id: novoId, status: "pending" });

            mostrarPergunta(novoId, true, liberarFormulario);

        }


        /* =========================================
           VALIDAÇÃO EM TEMPO REAL
        ========================================= */

        answerInput.addEventListener("input", function () {

            if (this.value.trim() !== "") {
                this.classList.remove("error");
                answerError.classList.remove("show");
            }

        });


        /* =========================================
           ENVIO DA RESPOSTA
        ========================================= */

        let respondido = false;

        form.addEventListener("submit", function (event) {

            event.preventDefault();

            if (respondido) return;

            const valor = answerInput.value.trim();

            if (valor === "") {

                answerInput.classList.add("error");

                answerError.classList.add("show");

                return;

            }

            respondido = true;

            const acertou = confere(valor, perguntas[indiceAtual].r);

            gravarEstado({
                id: indiceAtual,
                status: acertou ? "win" : "lose"
            });

            answerInput.blur();

            travarFormulario();

            mostrarResultado(acertou);

        });

    </script>

</body>

</html>
