<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUEM VAI</title>
    <!-- Importa a mesma stylesheet das outras páginas -->
    <link rel="stylesheet" href="style.css"> 
    
    <style>
        /* =========================================
           ESTRUTURA DA PÁGINA QUEM VAI
        ========================================= */
        
        /* Container fixo para as fotos ao fundo */
        #photo-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* Fica atrás do conteúdo */
            pointer-events: none; /* Não interfere nos cliques */
            overflow: hidden;
        }

        /* Foto individual que irá piscar/mover */
        .bg-photo {
            position: absolute;
            object-fit: cover;
            border-radius: 8px;
            opacity: 0;
            /* Suaviza o surgimento/desaparecimento e o movimento */
            transition: opacity 0.4s ease-in-out, transform 1.2s ease-out;
            will-change: opacity, transform;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* Mantém o título e conteúdo acima do fundo */
        .scene {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- Fundo dinâmico com fotos piscando -->
    <div id="photo-background"></div>

    <!-- Estrutura padrão de cena -->
    <section class="scene">

        <!-- Título na identidade do projeto -->
        <h1 class="title">QUEM VAI:</h1>

        <!-- Opções ou botão de voltar para a INDEX -->
        <nav class="menu" style="margin-top: 2rem;">
            <a class="menu-item" href="index.html">
                VOLTAR
            </a>
        </nav>

    </section>

    <!-- Script de animação das fotos -->
    <script>
        // CONFIGURAÇÕES DAS FOTOS
        const TOTAL_FOTOS = 20; // Altere para a quantidade de fotos na pasta 'photos'
        const PASTA_FOTOS = 'photos/'; 
        const EXTENSAO = '.jpg'; // Extensão das imagens (.jpg, .png, etc)
        
        const MAX_FOTOS_SIMULTANEAS = 5; // Quantidade de fotos em tela ao mesmo tempo
        const FREQUENCIA_TROCA = 500; // Intervalo para sortear novas fotos (em ms)

        const container = document.getElementById('photo-background');

        // Formata número com zeros à esquerda (1 -> 001, 10 -> 010)
        function formatarNumero(num) {
            return String(num).padStart(3, '0');
        }

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function spawnPhoto() {
            // Seleciona uma imagem aleatória da pasta 'photos/'
            const idFoto = Math.floor(random(1, TOTAL_FOTOS + 1));
            const path = `${PASTA_FOTOS}${formatarNumero(idFoto)}${EXTENSAO}`;

            const img = document.createElement('img');
            img.src = path;
            img.className = 'bg-photo';

            // Tamanho aleatório para a foto
            const largura = random(140, 260);
            img.style.width = `${largura}px`;

            // Posição inicial na tela (%)
            const x = random(5, 75);
            const y = random(5, 75);
            img.style.left = `${x}%`;
            img.style.top = `${y}%`;

            // Rotação inicial
            const rotInicial = random(-20, 20);
            img.style.transform = `scale(0.8) rotate(${rotInicial}deg)`;

            container.appendChild(img);

            // Animação de entrada (Pisca / Aparece se movendo)
            setTimeout(() => {
                const moveX = random(-40, 40);
                const moveY = random(-40, 40);
                const rotFinal = rotInicial + random(-10, 10);

                img.style.opacity = random(0.5, 0.9).toString();
                img.style.transform = `translate(${moveX}px, ${moveY}px) scale(1) rotate(${rotFinal}deg)`;
            }, 50);

            // Tempo de vida da foto na tela antes de sumir
            const tempoExibicao = random(1500, 3000);

            setTimeout(() => {
                img.style.opacity = '0';
                img.style.transform += ' scale(0.6)';

                // Remove do HTML após esmaecer completamente
                setTimeout(() => {
                    img.remove();
                }, 500);
            }, tempoExibicao);
        }

        // Loop contínuo que mantém as fotos piscando/surgindo
        setInterval(() => {
            if (container.children.length < MAX_FOTOS_SIMULTANEAS) {
                spawnPhoto();
            }
        }, FREQUENCIA_TROCA);
    </script>
</body>
</html>
