<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUGIRA UMA MÚSICA - SABATINI28</title>

    <style>
        /* =========================================
           FONTES
        ========================================= */
        @font-face {
            font-family: "POI Diode";
            src: url("fonts/POIDiodeTrial-Bold.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Moderat";
            src: url("fonts/Moderat-Mono-Light.woff2") format("woff2");
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        /* =========================================
           RESET & BASE
        ========================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #000;
            overflow-x: hidden;
        }

        .club-page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: #000;
            padding: 16px 16px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 700px) {
            .club-page { padding: 20px 30px 50px; }
        }

        @media (max-width: 380px) {
            .club-page { padding-left: 11px; padding-right: 11px; }
        }

        /* =========================================
           VOLTAR
        ========================================= */
        .back {
            position: absolute;
            top: 12px;
            left: 14px;
            border: 0;
            background: none;
            color: #FF5C00;
            font-family: "POI Diode", sans-serif;
            font-size: 42px;
            line-height: 1;
            cursor: pointer;
            z-index: 20;
            transition: transform 100ms ease, color 80ms linear;
        }

        .back:active {
            transform: translateX(-8px) scale(1.15);
        }

        /* =========================================
           TÍTULO
        ========================================= */
        .title {
            width: 100%;
            color: #00FF38;
            font-family: "POI Diode", sans-serif;
            font-size: clamp(40px, 12vw, 140px);
            line-height: 0.8;
            letter-spacing: -0.04em;
            text-align: center;
            user-select: none;
            margin-bottom: 28px;
        }

        /* =========================================
           FORMULÁRIO
        ========================================= */
        .form-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-label {
            color: #087AFF;
            font-family: "POI Diode", sans-serif;
            font-size: clamp(18px, 5vw, 28px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            user-select: none;
        }

        .instruction-text {
            color: #B000FF;
            font-family: "Moderat", monospace;
            font-size: clamp(12px, 3vw, 16px);
            font-weight: 300;
            line-height: 1.6;
            margin-top: 4px;
            letter-spacing: -0.01em;
        }

        .input-field {
            width: 100%;
            min-height: 78px;
            padding: 13px 12px;
            border: 4px solid #FF5C00;
            background: #000;
            color: #00FF38;
            font-family: "Moderat", monospace;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: 300;
            text-transform: uppercase;
            outline: none;
            transition: border-color 100ms ease, box-shadow 100ms ease;
        }

        .input-field::placeholder {
            color: #FF5C00;
            opacity: 0.6;
        }

        .input-field:focus {
            border-color: #00FF38;
            box-shadow: 0 0 12px rgba(0, 255, 56, 0.3);
        }

        .input-field.error {
            border-color: #FF5C00;
            box-shadow: 0 0 12px rgba(255, 92, 0, 0.5);
        }

        .error-message {
            color: #FF5C00;
            font-family: "Moderat", monospace;
            font-size: clamp(12px, 3vw, 16px);
            font-weight: 300;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 200ms ease;
        }

        .error-message.show { opacity: 1; }

        /* =========================================
           BOTÃO ENVIAR
        ========================================= */
        .submit-btn {
            display: block;
            width: 100%;
            padding: 12px 24px;
            border: 4px solid #B000FF;
            background: #000;
            color: #B000FF;
            font-family: "POI Diode", sans-serif;
            font-size: clamp(25px, 6vw, 42px);
            font-weight: 700;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            cursor: pointer;
            transition: background-color 70ms linear, color 70ms linear, transform 100ms ease;
            margin-top: 16px;
        }

        .submit-btn:active {
            background: #B000FF;
            color: #000;
            transform: scaleX(1.10) scaleY(0.90);
        }

        /* =========================================
           OVERLAY SUCESSO & NUVEM DANCANTE DE MÚSICAS
        ========================================= */
        .success-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease;
            z-index: 100;
            overflow: hidden;
        }

        .success-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .success-header {
            font-family: "POI Diode", sans-serif;
            font-size: clamp(28px, 6vw, 60px);
            color: #00FF38;
            text-transform: uppercase;
            text-align: center;
            z-index: 10;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 20px;
            border: 2px solid #00FF38;
            animation: pulse-header 500ms infinite alternate ease-in-out;
        }

        @keyframes pulse-header {
            0% { transform: scale(0.98); color: #00FF38; }
            100% { transform: scale(1.02); color: #E5FF00; }
        }

        /* Elementos Flutuantes da Lista */
        .song-cloud {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .floating-song {
            position: absolute;
            font-family: "POI Diode", sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
            user-select: none;
            animation: dance-and-blink 1.2s infinite alternate ease-in-out;
        }

        @keyframes dance-and-blink {
            0% {
                opacity: 0.2;
                transform: translate(0, 0) rotate(-6deg) scale(0.9);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.9;
                transform: translate(15px, -15px) rotate(8deg) scale(1.1);
            }
        }

        /* =========================================
           OVERLAY DE ERRO (TAYLOR SWIFT)
        ========================================= */
        .error-overlay {
            position: fixed;
            inset: 0;
            background: #FF0000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
        }

        .error-overlay.active {
            opacity: 1;
            pointer-events: auto;
            animation: red-flash 150ms infinite alternate;
        }

        @keyframes red-flash {
            0% { background: #FF0000; }
            100% { background: #8B0000; }
        }

        .error-title {
            font-family: "POI Diode", sans-serif;
            font-size: clamp(50px, 16vw, 220px);
            font-weight: 700;
            color: #FFF;
            text-align: center;
            line-height: 0.8;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            animation: error-bounce 200ms infinite alternate;
        }

        @keyframes error-bounce {
            0% { transform: scale(0.95) rotate(-3deg); }
            100% { transform: scale(1.05) rotate(3deg); }
        }

        /* =========================================
           FLASH
        ========================================= */
        .flash {
            position: fixed;
            inset: 0;
            background: #FFF;
            opacity: 0;
            pointer-events: none;
            z-index: 300;
        }

        .flash.active {
            animation: flash-effect 100ms linear;
        }

        @keyframes flash-effect {
            0% { opacity: 0; }
            25% { opacity: .8; }
            100% { opacity: 0; }
        }
    </style>
</head>

<body>

    <main class="club-page">

        <!-- VOLTAR -->
        <button class="back" onclick="history.back()" aria-label="Voltar">←</button>

        <!-- TÍTULO -->
        <h1 class="title">
            SUGIRA UMA<br>MÚSICA
        </h1>

        <!-- FORMULÁRIO -->
        <form class="form-container" id="songForm" onsubmit="handleSubmit(event)">

            <div class="input-group">
                <label class="input-label" for="song">
                    Música / Artista
                </label>

                <p class="instruction-text">
                    Qual som não pode faltar na pista? Manda o nome da música ou do artista.
                </p>

                <input 
                    type="text" 
                    id="song" 
                    class="input-field" 
                    placeholder="ex: CHARLI xcx - VON DUTCH" 
                    maxlength="120" 
                    autocomplete="off"
                >

                <div class="error-message" id="songError">
                    Digite uma música ou artista!
                </div>
            </div>

            <button type="submit" class="submit-btn">
                ENVIAR SUGESTÃO
            </button>

        </form>

    </main>

    <!-- OVERLAY SUCESSO (COM MÚSICAS DANÇANDO) -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-header">SUGESTÃO ACEITA!</div>
        <div class="song-cloud" id="songCloud"></div>
    </div>

    <!-- OVERLAY DE ERRO (TAYLOR SWIFT) -->
    <div class="error-overlay" id="errorOverlay">
        <div class="error-title">
            ERRO!<br>PROIBIDO!
        </div>
    </div>

    <!-- FLASH -->
    <div class="flash" id="flash"></div>

    <script>
        /* =========================================
           BASE DE DADOS SIMULADA (MÚSICAS JA ENVIADAS)
        ========================================= */
        const initialSongs = [
            "LADY GAGA - DISEASE",
            "CHARLI XCX - 360",
            "SABRINA CARPENTER - ESPRESSO",
            "BILLIE EILISH - LUNCH",
            "CHAPPELL ROAN - PINK PONY CLUB",
            "DUA LIPA - HOUDINI",
            "MADONNA - HUNG UP",
            "TROYE SIVAN - RUSH",
            "ROSALÍA - BIZCOCHITO",
            "DAFT PUNK - ONE MORE TIME"
        ];

        /* =========================================
           ELEMENTOS
        ========================================= */
        const form = document.getElementById("songForm");
        const songInput = document.getElementById("song");
        const songError = document.getElementById("songError");
        const successOverlay = document.getElementById("successOverlay");
        const errorOverlay = document.getElementById("errorOverlay");
        const songCloud = document.getElementById("songCloud");
        const flash = document.getElementById("flash");

        /* Paleta de cores vibrantes Y2K / Cyber */
        const brightColors = ["#00FF38", "#FF5C00", "#B000FF", "#087AFF", "#E5FF00", "#FF007A", "#00FFFF"];

        /* =========================================
           VALIDAÇÃO EM TEMPO REAL
        ========================================= */
        songInput.addEventListener("blur", function() {
            if (this.value.trim() === "") {
                this.classList.add("error");
                songError.classList.add("show");
            } else {
                this.classList.remove("error");
                songError.classList.remove("show");
            }
        });

        songInput.addEventListener("input", function() {
            if (this.value.trim() !== "") {
                this.classList.remove("error");
                songError.classList.remove("show");
            }
        });

        /* =========================================
           EFEITO FLASH
        ========================================= */
        function doFlash() {
            flash.classList.remove("active");
            void flash.offsetWidth;
            flash.classList.add("active");
        }

        /* =========================================
           GERADOR DE ELEMENTOS DANÇANTES
        ========================================= */
        function renderFloatingSongs(newSong) {
            songCloud.innerHTML = "";
            const allSongs = [...initialSongs, newSong];

            // Gera de 20 a 30 itens na tela para preencher
            const totalItems = 25; 

            for (let i = 0; i < totalItems; i++) {
                const songText = allSongs[i % allSongs.length];
                const el = document.createElement("span");
                
                el.className = "floating-song";
                el.innerText = songText;

                // Estilos aleatórios de cor, posição e tamanho
                const color = brightColors[Math.floor(Math.random() * brightColors.length)];
                const fontSize = Math.floor(Math.random() * (45 - 16 + 1)) + 16; // 16px a 45px
                const top = Math.floor(Math.random() * 85); // % top
                const left = Math.floor(Math.random() * 75); // % left
                const delay = (Math.random() * 1.5).toFixed(2); // delay da animação

                el.style.color = color;
                el.style.fontSize = fontSize + "px";
                el.style.top = top + "%";
                el.style.left = left + "%";
                el.style.animationDelay = delay + "s";

                songCloud.appendChild(el);
            }
        }

        /* =========================================
           ENVIO DO FORMULÁRIO
        ========================================= */
        function handleSubmit(event) {
            event.preventDefault();

            const query = songInput.value.trim().toUpperCase();

            // Validação de campo vazio
            if (query === "") {
                songInput.classList.add("error");
                songError.classList.add("show");
                return;
            }

            /* -----------------------------------------
               REGRA DE BLOQUEIO: TAYLOR / TAYLOR SWIFT
            ----------------------------------------- */
            if (query.includes("TAYLOR") || query.includes("TAYLOR SWIFT")) {
                doFlash();
                errorOverlay.classList.add("active");

                // Trava a tela e volta para a inicial sem salvar após 3 segundos
                setTimeout(function() {
                    window.location.href = "index.html";
                }, 3000);

                return;
            }

            /* -----------------------------------------
               FLUXO NORMAL DE SUCESSO
            ----------------------------------------- */
            console.log("Música sugerida:", query);

            // Gerar a nuvem de músicas piscando
            renderFloatingSongs(query);

            // Exibir a tela e disparar o flash
            successOverlay.classList.add("active");
            doFlash();

            // Desabilitar o formulário
            form.style.pointerEvents = "none";
            form.style.opacity = "0.5";

            // Retorna para a home após 4.5 segundos (tempo para ver as músicas)
            setTimeout(function() {
                window.location.href = "index.html";
            }, 4500);
        }
    </script>
</body>
</html>
